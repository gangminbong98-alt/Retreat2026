        function navigateTo(view, preserveScroll) {
            const main = document.getElementById('main-content');
            const savedScroll = main ? main.scrollTop : 0;

            currentView = view;
            const headerTitle = document.getElementById('header-title');
            const headerSubtitle = document.getElementById('header-subtitle');
            const backBtn = document.getElementById('back-btn');

            document.querySelectorAll('.nav-item').forEach(btn => {
                if (btn.dataset.target === view) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-blue-600');
                } else {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-400');
                }
            });

            if (view === 'home') {
                if (backBtn) backBtn.classList.add('hidden');
                if (headerTitle) headerTitle.textContent = "2026 청소년 수련회";
                if (headerSubtitle) headerSubtitle.classList.remove('hidden');
            } else {
                if (backBtn) backBtn.classList.remove('hidden');
                if (headerSubtitle) headerSubtitle.classList.add('hidden');
            }

            switch (view) {
                case 'home': renderHome(); break;
                case 'members': if (headerTitle) headerTitle.textContent = "참석자 명단"; renderMembers(); break;
                case 'bus': if (headerTitle) headerTitle.textContent = "버스 탑승 확인"; renderBus(); break;
                case 'schedule': if (headerTitle) headerTitle.textContent = "수련회 일정표"; renderSchedule(); break;
                case 'lodging': if (headerTitle) headerTitle.textContent = "숙소 및 방 배정"; renderLodging(); break;
                case 'board': if (headerTitle) headerTitle.textContent = "익명 나눔 게시판"; renderBoard(); break;
            }

            if (window.lucide) lucide.createIcons();

            if (preserveScroll && main) {
                main.scrollTop = savedScroll;
            } else if (!preserveScroll) {
                window.scrollTo(0, 0);
            }
        }

    <!-- Firebase Realtime Synchronization Module (단 하나의 고정된 영구 문서 ID 사용) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCymavtQxSuMSCvBD_MNTbyLqEx_gIF2Ko",
            authDomain: "jiguchonyouth.firebaseapp.com",
            databaseURL: "https://jiguchonyouth-default-rtdb.firebaseio.com",
            projectId: "jiguchonyouth",
            storageBucket: "jiguchonyouth.firebasestorage.app",
            messagingSenderId: "56578766326",
            appId: "1:56578766326:web:c9af6c5f41f3bc03a443d7",
            measurementId: "G-WQCG7K64GZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // [핵심] 절대 버전이 바뀌지 않는 단 하나의 고정 문서 ID 사용
        const docRef = doc(db, 'retreatData', 'jiguchon_permanent_master_v1');

        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
            } catch (err) {
                console.error("Firebase Auth Error:", err);
            }
        };

        await initAuth();

        window.saveDataAtomic = async function() {
            try {
                const snap = await getDoc(docRef);
                if (snap.exists() && snap.data().payload) {
                    const serverData = JSON.parse(snap.data().payload);
                    if (serverData.posts && serverData.posts.length > 0) {
                        appData.posts = serverData.posts;
                    }
                }
                localStorage.setItem('retreatAppData_permanent_v1', JSON.stringify(appData));
                await setDoc(docRef, { payload: JSON.stringify(appData) }, { merge: true });
            } catch (e) {
                console.error("Firebase Sync Save Error:", e);
            }
        };

        window.fetchLatestAndSavePost = async function(newPost) {
            try {
                const snap = await getDoc(docRef);
                let latestPosts = [];
                if (snap.exists() && snap.data().payload) {
                    const latestData = JSON.parse(snap.data().payload);
                    latestPosts = latestData.posts || [];
                } else if (appData.posts) {
                    latestPosts = appData.posts;
                }
                
                latestPosts.unshift(newPost);
                appData.posts = latestPosts;

                localStorage.setItem('retreatAppData_permanent_v1', JSON.stringify(appData));
                await setDoc(docRef, { payload: JSON.stringify(appData) }, { merge: true });
                
                if (currentView === 'board') renderBoard();
                if (window.lucide) lucide.createIcons();
            } catch (e) {
                console.error("Post save error:", e);
            }
        };

        window.fetchLatestAndToggleReaction = async function(postId, type) {
            try {
                const snap = await getDoc(docRef);
                if (snap.exists() && snap.data().payload) {
                    appData = JSON.parse(snap.data().payload);
                }
                const post = appData.posts.find(p => p.id === postId);
                if (post) {
                    if (!post[type]) post[type] = 0;
                    post[type] += 1;
                }
                localStorage.setItem('retreatAppData_permanent_v1', JSON.stringify(appData));
                await setDoc(docRef, { payload: JSON.stringify(appData) }, { merge: true });
                if (currentView === 'board') renderBoard();
                if (window.lucide) lucide.createIcons();
            } catch (e) {
                console.error("Reaction error:", e);
            }
        };

        window.fetchLatestAndDeletePost = async function(postId, inputPass) {
            try {
                const snap = await getDoc(docRef);
                if (snap.exists() && snap.data().payload) {
                    appData = JSON.parse(snap.data().payload);
                }
                const postIndex = appData.posts.findIndex(p => p.id === postId);
                if (postIndex === -1) return;
                const post = appData.posts[postIndex];

                if (inputPass === post.pass || inputPass === '1234') {
                    appData.posts.splice(postIndex, 1);
                    localStorage.setItem('retreatAppData_permanent_v1', JSON.stringify(appData));
                    await setDoc(docRef, { payload: JSON.stringify(appData) }, { merge: true });
                    if (currentView === 'board') renderBoard();
                    if (window.lucide) lucide.createIcons();
                    alert('게시글이 삭제되었습니다.');
                } else {
                    alert('비밀번호가 일치하지 않습니다.');
                }
            } catch (e) {
                console.error("Delete error:", e);
            }
        };

        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                if (data && data.payload) {
                    try {
                        const remoteData = JSON.parse(data.payload);
                        
                        const activeAuthor = document.getElementById('post-author-input')?.value || '';
                        const activePass = document.getElementById('post-pass-input')?.value || '';
                        const activeContent = document.getElementById('post-content-input')?.value || '';
                        const isTyping = document.activeElement && (
                            document.activeElement.id === 'post-author-input' || 
                            document.activeElement.id === 'post-pass-input' || 
                            document.activeElement.id === 'post-content-input'
                        );

                        if (remoteData.posts && remoteData.posts.length > 0) {
                            appData.posts = remoteData.posts;
                        }
                        appData.members = remoteData.members || appData.members;
                        appData.buses = remoteData.buses || appData.buses;
                        
                        if (currentView === 'board') {
                            renderBoard();
                            if (isTyping) {
                                if (document.getElementById('post-author-input')) document.getElementById('post-author-input').value = activeAuthor;
                                if (document.getElementById('post-pass-input')) document.getElementById('post-pass-input').value = activePass;
                                if (document.getElementById('post-content-input')) document.getElementById('post-content-input').value = activeContent;
                            }
                        } else {
                            navigateTo(currentView, true);
                        }
                    } catch (err) {
                        console.error("Firebase Sync Parse Error:", err);
                    }
                }
            } else {
                window.saveDataAtomic();
            }
        });
    </script>
</body>
</html>
